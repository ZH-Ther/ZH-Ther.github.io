  <style>
    .article-page{max-width:800px;margin:0 auto;padding:70px 24px 100px}.article-page>a{color:var(--blue);font-size:13px}.article-page h1{margin-top:50px;font-size:clamp(38px,7vw,64px)}.article-meta{margin:22px 0;color:var(--muted);font-family:var(--mono);font-size:12px}.article-excerpt{font-size:19px;color:var(--muted)}.article-body{margin-top:45px;font-size:17px;line-height:1.9}.article-body h1,.article-body h2,.article-body h3,.article-body h4{margin:1.7em 0 .65em;color:var(--navy);font-family:var(--serif);line-height:1.3}.article-body h1{font-size:2.1em}.article-body h2{font-size:1.65em}.article-body h3{font-size:1.3em}.article-body p,.article-body ul,.article-body ol{margin:1em 0}.article-body a{color:var(--blue);text-decoration:underline;text-underline-offset:3px}.article-body blockquote{margin:1.5em 0;padding:.2em 0 .2em 1.2em;border-left:3px solid var(--accent);color:var(--muted)}.article-body img{display:block;max-width:100%;height:auto;margin:2em auto;border-radius:8px}.article-body pre{overflow:auto;margin:1.6em 0;padding:18px;border:1px solid var(--line);border-radius:8px;background:#f6f8fa}.article-body code{padding:.15em .35em;border-radius:4px;background:var(--soft);font-family:var(--mono);font-size:.88em}.article-body pre code{padding:0;background:transparent}.article-body table{display:block;width:100%;overflow:auto;border-collapse:collapse}.article-body th,.article-body td{padding:8px 12px;border:1px solid var(--line)}.article-body hr{margin:2.5em 0;border:0;border-top:1px solid var(--line)}.article-body .katex-display{overflow:auto;padding:.5em 0}.article-state{padding:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}@media(max-width:620px){.article-page{padding-top:36px}.article-body{font-size:16px}}
  </style>
